name: Sync upstream

on:
  schedule:
    - cron: "17 21 */3 * *" # 3日おき 06:17 JST（月末は31日→1日で間隔が縮む）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # フォーク元（andoshin11/orca-milestone）のデフォルトブランチを、このリポジトリのデフォルトブランチへ取り込む。
      # GitHub の「Sync fork」ボタンと同じ API。競合したら失敗して止まる。
      - run: gh repo sync "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
